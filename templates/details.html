{% extends 'navbar.html' %}

{% block title %}

{% block afterNav %}
<!-- Category container starts here -->
<div class="container my-4">
    <div>
        <h3 class="display-5">{{Task.title}} </h3>
        <p class="lead"></p>
        <hr class="my-2">
        <p> {{Task.description}} </p>
        <hr class="my-2">

    </div>
</div>

<div class="container">
    <h4 class="py-3">leave a comment</h4>
    <form action="" method="post">
        <div class="form-group my-3">
            <label for="exampleInputEmail1">Short Sweet Title</label>
            <input type="text" class="form-control" id="title" name="title" aria-describedby="emailHelp">
            <small id="emailHelp" class="form-text text-muted">Keep your title as short and crisp as
                possible</small>
        </div>
        <input type="hidden" name="sno" value="">
        <div class="form-group">
            <label for="exampleFormControlTextarea1">Ellaborate Your Concern</label>
            <textarea class="form-control" id="desc" name="desc" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-outline-dark my-4">Submit</button>
    </form>
</div>



<div class="container mb-5" id="ques">
    <h4 class="py-2">The Concerns</h4>

    <div class="media my-3">
        <img src="static/imgages/slider-1.jpg" width="84px" class="mr-3" alt="...">
        <div class="media-body">
            <h5 class="mt-0"> <a class="text-dark" href=""></a></h5>
        </div>
        <div class="font-weight-bold my-0"> Asked by:
        </div>
    </div>

    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <p class="display-6">No Concerns Yet</p>
            <p class="lead"> Do you have one</p>
        </div>
    </div>
    {% endblock %}
